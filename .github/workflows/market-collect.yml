name: 市場データ（カーセンサー相場）の収集
on:
  schedule:
    - cron: '0 20 * * 0'        # 毎週月曜 05:00 JST に起動し、第1・第3月曜だけ実行（スクリプト側で判定）
  workflow_dispatch:
    inputs:
      force:
        description: '第1・第3月曜以外でも実行する（1 で実行）'
        required: false
        default: '1'
permissions:
  contents: write
concurrency: market-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: 収集
        env:
          MARKET_FORCE: ${{ github.event.inputs.force }}
        run: node scripts/market_collect.mjs
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- market_latest.json; then echo "変更なし"; exit 0; fi
          git config user.name  "market-sync[bot]"
          git config user.email "market-sync@users.noreply.github.com"
          git add market_latest.json
          git commit -m "市場データ収集（自動 $(TZ=Asia/Tokyo date '+%Y-%m-%d')）"
          git push
