name: 南自動車 C-MATCH 反響データ更新
on:
  schedule:
    - cron: '10 21 * * *'       # 毎日 06:10 JST（当月分。JSTの1〜3日は前月分も）。掲載数を毎日残すため
    - cron: '10 21 1 * *'       # 毎月2日 06:10 JST（前月分の締め）
  workflow_dispatch:
    inputs:
      months:
        description: '対象月（例 202609,202608）。空なら自動'
        required: false
concurrency: minami-hankyo
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: 取得して南自動車ダッシュボードへ送る
        env:
          MINAMI_CMATCH_ID: ${{ secrets.MINAMI_CMATCH_ID }}
          MINAMI_CMATCH_PW: ${{ secrets.MINAMI_CMATCH_PW }}
          MINAMI_GAS_URL: ${{ secrets.MINAMI_GAS_URL }}
          MINAMI_GAS_KEY: ${{ secrets.MINAMI_GAS_KEY }}
          HANKYO_YM: ${{ github.event.inputs.months }}
        run: node scripts/minami_hankyo.mjs
