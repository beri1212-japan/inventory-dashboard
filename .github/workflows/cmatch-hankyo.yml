name: C-MATCH 反響データ更新
on:
  schedule:
    - cron: '0 21 * * *'       # 毎日 06:00 JST（当月分。JSTの1〜3日は前月分も取り直す＝前月の締め）
  workflow_dispatch:
    inputs:
      months:
        description: '対象月（例 202609,202608）。空なら自動'
        required: false
permissions:
  contents: write
concurrency: cmatch-hankyo
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: 取得して取り込む
        env:
          CMATCH_ID: ${{ secrets.CMATCH_ID }}
          CMATCH_PW: ${{ secrets.CMATCH_PW }}
          HANKYO_YM: ${{ github.event.inputs.months }}
        run: node scripts/cmatch_hankyo.mjs
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- cmatch_latest.json; then echo "変更なし"; exit 0; fi
          git config user.name  "cmatch-sync[bot]"
          git config user.email "cmatch-sync@users.noreply.github.com"
          git add cmatch_latest.json
          git commit -m "反響データ更新（自動取込 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"
          git push
